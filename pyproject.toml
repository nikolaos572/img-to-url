[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img-to-url"
version = "0.1.0"
description = "Paste or upload an image, get a direct URL to share."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.37",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "requests>=2.31",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that build and run the Docker image (require Docker)",
]
filterwarnings = [
    # Emitted by starlette's own testclient import (httpx -> httpx2
    # migration). Third-party, test-only, nothing here can act on it.
    # Message-only filter (no category field): StarletteDeprecationWarning
    # does not reliably subclass DeprecationWarning across versions.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
